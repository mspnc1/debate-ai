name: Live Model Routing Smoke

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Model coverage scope
        required: false
        default: default
        type: choice
        options:
          - default
          - curated
          - all
      providers:
        description: Optional comma-separated provider list
        required: false
        default: ''
        type: string
      require_all_keys:
        description: Fail if any selected provider key is missing
        required: false
        default: true
        type: boolean

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live model routing smoke
        run: npm run test:model-routing:live
        env:
          LIVE_MODEL_SCOPE: ${{ inputs.scope }}
          LIVE_MODEL_PROVIDERS: ${{ inputs.providers }}
          LIVE_MODEL_REQUIRE_ALL_KEYS: ${{ inputs.require_all_keys && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
